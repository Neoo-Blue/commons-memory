[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commons-memory"
version = "0.2.0"
description = "Unified cross-AI memory: one MCP hub for shared memory, code graph, handoffs, reasoning logs and safe secret references."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Neoo-Blue" }]
keywords = ["mcp", "memory", "agents", "knowledge-graph", "llm", "a2a"]
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
commons = "commons_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commons_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
