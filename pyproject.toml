[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24"]
build-backend = "hatchling.build"

[project]
name = "commons-memory"
version = "0.34.1"
description = "Unified cross-AI memory: one MCP hub for shared memory, code graph, handoffs, reasoning logs and safe secret references."
dynamic = ["readme"]
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Neoo-Blue" }]
keywords = ["mcp", "memory", "agents", "knowledge-graph", "llm", "a2a"]
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
postgres = ["psycopg[binary]>=3.1"]
encryption = ["sqlcipher3-binary>=0.5; platform_system == 'Linux'", "cryptography>=42"]
code = [
  "tree-sitter>=0.23",
  "tree-sitter-javascript>=0.23",
  "tree-sitter-typescript>=0.23",
  "tree-sitter-c>=0.23",
  "tree-sitter-c-sharp>=0.23",
  "tree-sitter-cpp>=0.23",
  "tree-sitter-go>=0.23",
  "tree-sitter-java>=0.23",
  "tree-sitter-ruby>=0.23",
  "tree-sitter-rust>=0.23",
]
tokens = ["tiktoken>=0.7"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
http = ["uvicorn>=0.30"]
expose = ["ngrok>=1.4"]
sftp = ["paramiko>=3"]
smb = ["smbprotocol>=1.13"]
ws = ["websockets>=12"]
vault = ["cryptography>=42"]
vec = ["sqlite-vec>=0.1.6"]
all = ["commons-memory[embed,postgres,encryption,code,tokens,otel,http,vec]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2"]

[project.scripts]
commons = "commons_memory.cli:main"
commons-memory = "commons_memory.cli:main"  # so `uvx commons-memory` works with no --from

[project.urls]
Homepage = "https://github.com/Neoo-Blue/commons-memory"
Changelog = "https://github.com/Neoo-Blue/commons-memory/blob/main/CHANGELOG.md"
Issues = "https://github.com/Neoo-Blue/commons-memory/issues"

# PyPI renders the README without the repo next to it: make its relative links and images absolute
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[([^\]]*)\]\((?!https?://)([^)]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/Neoo-Blue/commons-memory/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)]+)\)'
replacement = '](https://github.com/Neoo-Blue/commons-memory/blob/main/\1)'

[tool.hatch.build.targets.sdist]  # benchmark results and screenshots stay on GitHub; the README links to them
exclude = ["benchmarks/results", "docs/screenshots", "docs/img", ".github", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/commons_memory"]

[tool.hatch.build.targets.wheel.force-include]
"CHANGELOG.md" = "commons_memory/CHANGELOG.md"  # the release channel tells agents what changed

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
