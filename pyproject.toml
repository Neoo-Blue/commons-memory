[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commons-memory"
version = "0.8.0"
description = "Unified cross-AI memory: one MCP hub for shared memory, code graph, handoffs, reasoning logs and safe secret references."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Neoo-Blue" }]
keywords = ["mcp", "memory", "agents", "knowledge-graph", "llm", "a2a"]
dependencies = ["mcp>=1.12,<2"]

[project.optional-dependencies]
embed = ["fastembed>=0.3"]
postgres = ["psycopg[binary]>=3.1"]
encryption = ["sqlcipher3-binary>=0.5; platform_system == 'Linux'", "cryptography>=42"]
code = ["tree-sitter>=0.23", "tree-sitter-javascript>=0.23", "tree-sitter-typescript>=0.23"]
tokens = ["tiktoken>=0.7"]
otel = ["opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-http>=1.25"]
http = ["uvicorn>=0.30"]
expose = ["ngrok>=1.4"]
sftp = ["paramiko>=3"]
smb = ["smbprotocol>=1.13"]
ws = ["websockets>=12"]
all = ["commons-memory[embed,postgres,encryption,code,tokens,otel,http]"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2"]

[project.scripts]
commons = "commons_memory.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/commons_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
