<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Commons dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e8835f'/%3E%3C/svg%3E">
<style>/*@CSS*/</style></head><body>
<div class="app"><aside id="side"><div class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6.5" r="2.6"/><circle cx="6.5" cy="16" r="2.6"/><circle cx="17.5" cy="16" r="2.6"/><path d="M10.7 8.8 7.8 13.7M13.3 8.8l2.9 4.9M9.1 16h5.8"/></svg><span>Commons</span></div><nav class="nav" id="tabs" aria-label="Workspaces"></nav></aside>
<div class="main-col"><header><button class="menu-btn" aria-label="Menu" onclick="$('#side').classList.toggle('open')"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav><h1 id="ttl">Overview</h1><div class="spacer"></div>
<div class="hstat" id="hstat" aria-live="polite"></div>
<button class="search" onclick="pal()" aria-label="Search or jump to (Cmd K)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg><span>Search or jump to</span><kbd>⌘K</kbd></button>
<button class="icon-btn" onclick="theme()" aria-label="Switch theme" title="Switch theme (t)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7.5"/><path d="M12 4.5v15a7.5 7.5 0 0 0 0-15z" fill="currentColor" stroke="none"/></svg></button>
<button class="icon-btn" onclick="shellMore(this)" aria-label="More" title="More"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18.5" cy="12" r="1.3"/></svg></button></header>
<div class="subtabs" id="subtabs"></div><div id="ks"></div><div id="ob"></div><main id="m" aria-live="polite">loading…</main></div></div>
<nav class="bnav" id="bnav" aria-label="Workspaces"></nav>
<div id="pal" role="dialog" aria-modal="true" aria-label="Command palette" onclick="if(event.target.id=='pal')palClose()"><div class="box"><input id="palq" placeholder="Jump to a page, find a place, search memory…" autocomplete="off"><div class="res" id="palr"></div></div></div>
<div id="toasts" aria-live="assertive"></div>
<script>/*@JS*/</script></body></html>
