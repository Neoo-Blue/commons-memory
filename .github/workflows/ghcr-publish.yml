# Copy to .github/workflows/ghcr-publish.yml (kept under ci/ because the bot token lacks the `workflow` scope).
# Builds linux/amd64 + linux/arm64 and pushes ghcr.io/<owner>/commons-memory:<version> and :latest on v* tags.
name: publish-image
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/commons-memory
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  # After the image is pushed, list this version in the official MCP Registry (registry.modelcontextprotocol.io).
  # GitHub OIDC proves we own io.github.Neoo-Blue/*; the image's io.modelcontextprotocol.server.name label proves the
  # image is ours. No secret is stored.
  mcp-registry:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: "install mcp-publisher (pinned and checksum-verified, since this job can mint OIDC tokens)"
        run: |
          curl -fsSLo p.tgz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  p.tgz" | sha256sum -c -
          tar xzf p.tgz mcp-publisher
      - name: stamp this version into server.json
        run: |
          V=${GITHUB_REF_NAME#v}
          jq --arg v "$V" '.version=$v | .packages[0].identifier="ghcr.io/neoo-blue/commons-memory:"+$v' server.json > s.tmp && mv s.tmp server.json
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
