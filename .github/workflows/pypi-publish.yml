# On every GitHub release: attaches the wheel + sdist to the release (the one-line installers use them) and
# publishes to PyPI with trusted publishing (OIDC): no token is stored.
# One-time setup on pypi.org (Account settings > Publishing > Add a new pending publisher):
#   PyPI project name: commons-memory · Owner: Neoo-Blue · Repository: commons-memory
#   Workflow name: pypi-publish.yml · Environment: pypi
name: publish-pypi
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the wheel and sdist to the release: the one-line installers download them
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - name: the tag matches the package version
        if: github.event_name == 'release'
        run: test "v$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)" = "${{ github.event.release.tag_name }}"
      - name: attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
